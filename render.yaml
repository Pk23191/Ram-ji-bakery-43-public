services:
  - type: web
    name: ram-ji-bakery-api
    runtime: node
    rootDir: .
    buildCommand: npm --prefix server ci
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: USE_MONGO
        value: "false"
      - key: JWT_SECRET
        generateValue: true
